  version: '1.35'
  compounds: 1132805
  freeze_date: '2026-08-15'
  maintainer: Thor Klamt <thor.klamt@l3s.de>
  repository: https://github.com/ThorKlm/theobroma
  dataset: https://huggingface.co/datasets/ThorKl/theobroma
  website: https://theobroma.l3s.uni-hannover.de
# in_theobroma counts primary attribution under sequential ingestion, not the number of
# compounds a source contains. A compound already present from an earlier source becomes a
# co-attestation rather than a primary attribution.
deduplication:
  method: Full 27-character InChIKey
  note: Stereoisomers kept as separate entries (486,032 connectivity families)
  canonicalization: SMILES canonicalised with RDKit MolToSmiles(MolFromSmiles(smi)); the
    deduplication key is the full InChIKey computed from the standardised molecule
