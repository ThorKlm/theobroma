removed_sources:
- name: CMNPD
  reason: 'CC BY-NC-SA 4.0. Excluded under the conservative operational interpretation adopted
    here: the NonCommercial term alone places it outside the commercially reusable fraction, and
    ShareAlike would additionally propagate if the integration were treated as an adaptation
    rather than a collection.'
  exclusive_compounds_removed: 3847
  multi_source_stripped: 27003
enrichment:
- name: LOTUS
  source: https://zenodo.org/records/7534071
  file: 260413_frozen_metadata.csv.gz
  method: InChIKey matching
  added: 64k organisms, 146k names, 176k DOIs, 155k NP classes, 174k ClassyFire
- name: COCONUT 2.0 SQL dump
  source: https://zenodo.org/records/13692394
  file: coconut-09-2024.sql.zip (1.9 GB)
  method: Streaming COPY block extraction to TSV
  script: extract_coconut_meta.py
  added: 13.5k organisms, 129k names, 114k DOIs, 27k regions
- name: PubChem synonyms
  source: https://pubchem.ncbi.nlm.nih.gov/rest/pug
  method: Individual InChIKey GET queries (~18h, 1.57 it/s)
  added: 348,487 synonyms for 83,808 compounds
- name: GBIF species occurrences
  source: https://api.gbif.org/v1
  method: Species match + occurrence country lookup
  added: 17,689 geographic regions
- name: NPClassifier batch
  source: https://zenodo.org/records/5068687
  models: NP_classifier_class_V1.hdf5, NP_classifier_superclass_V1.hdf5, NP_classifier_pathway_V1.hdf5
  method: Dual-input fingerprints (2048-d formula + 4096-d binary)
  added: 196,201 class annotations, 1,042,831 pathway annotations
  note: batch output before tier assignment; 206,042 compounds carry an NPClassifier class in the
    deployed corpus, the remainder having a source-supplied class that takes precedence
- name: XGBoost inferred classification
  method: Per-class XGBoost on Morgan 2048-d + MACCS 167-d + ChemBERTa 256-d PCA (2,471-d)
  classes: 501
  labelled: 384006
  split: 57,601 stratified holdout, then 267,652 search / 58,753 validation
  hpo: Optuna, 75 trials, four workers, seed 0
  best_params:
    max_depth: 9
    learning_rate: 0.0888
    subsample: 0.8759
    colsample_bytree: 0.6922
    min_child_weight: 3
    reg_lambda: 1.4123
    reg_alpha: 0.005978
    gamma: 0.1840
    weight_mode: none
    rounds: 467
  evaluation:
    search_macro_f1: 0.8120
    cv_macro_f1_mean: 0.8090
    cv_macro_f1_std: 0.0018
    cv_micro_f1_mean: 0.8360
    holdout_macro_f1: 0.8246
    holdout_micro_f1: 0.8455
    majority_class_baseline_macro_f1: 0.000327
  added: 300,141 inferred class annotations
  note: values taken from hpo_results_v135.json in classifier_reproducibility.zip
- name: ADMET-AI
  source: https://github.com/swansonk14/admet_ai
  method: Chemprop D-MPNN ensemble
  endpoints: 41 ADMET-AI endpoints (47 stored columns including 6 RDKit-computed flags)
  added: ADMET predictions for all compounds
- name: ChemBERTa embeddings
  model: seyonec/ChemBERTa-zinc-base-v1
  method: Mean pooling over non-padding tokens, 768-d
  index: FAISS HNSW (M=32, efConstruction=200, efSearch=128)
- name: SEA-style target predictions
  source: ChEMBL v34 known actives
  method: Max Morgan Tanimoto against known ligand sets
  targets: 25
  threshold: Tc >= 0.5
- name: ChEBI 3-stars
  type: enrichment
  url: https://www.ebi.ac.uk/chebi
  download_url: https://ftp.ebi.ac.uk/pub/databases/chebi/SDF/chebi_3_stars.sdf.gz
  download_date: '2026-05-15'
  version: '3-stars 2026-05-01'
  format: SDF
  raw_compounds: 52903
  matched_inchikeys: 20285
  compounds_annotated: 19677
  synonyms_added: 84019
  metadata_added:
    chebi_id: 19677
    chebi_definition: 16763
    chebi_iupac_name: 19029
    chebi_pmids: 12017
    chebi_xrefs: 19673
  matching: full 27-character InChIKey
  license_data: CC BY 4.0
  citation: 10.1093/nar/gkad1031
  notes: Enrichment layer; does not alter compound license_tier. Cross-references to 21 external databases packed as JSONB in chebi_xrefs column.
pipeline:
  corpus_host:
    note: integration, standardisation, deduplication, taxonomy and licence resolution
    python: '3.13.5'
    rdkit: '2026.03.1'
    pandas: '3.0.2'
    scipy: '1.17.1'
    transformers: '5.5.4'
    faiss: '1.13.2'
    postgresql: 17.11 (Debian)
  training_host:
    note: hyperparameter search, model fitting and embedding computation, GPU instance
    python: '3.12.13'
    xgboost: '3.2.0'
    optuna: 4.9.0 (recorded in optuna_v135.db version_info)
    transformers: '5.5.4'
    admet_ai: 2.0.1
